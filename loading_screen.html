<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiagnoSense - Processing Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F8FAFF 0%, #F0F4FF 100%);
            color: #3A4560;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Background Pattern */
        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 15% 25%, rgba(42, 102, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(0, 193, 135, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* AI Waves Animation */
        .ai-waves {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        .wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(42, 102, 255, 0.08);
            border-radius: 50%;
            animation: waveExpand 3s ease-out infinite;
        }

        .wave:nth-child(1) {
            width: 200px;
            height: 200px;
            animation-delay: 0s;
        }

        .wave:nth-child(2) {
            width: 200px;
            height: 200px;
            animation-delay: 1s;
        }

        .wave:nth-child(3) {
            width: 200px;
            height: 200px;
            animation-delay: 2s;
        }

        @keyframes waveExpand {
            0% {
                width: 200px;
                height: 200px;
                opacity: 0.6;
            }
            100% {
                width: 600px;
                height: 600px;
                opacity: 0;
            }
        }

        /* Loading Container */
        .loading-container {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .loading-logo {
            width: 140px;
            height: 140px;
            margin: 0 auto 32px;
            background: linear-gradient(135deg, #2A66FF, #467DFF);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 8px 24px rgba(42, 102, 255, 0.25),
                0 0 0 12px rgba(42, 102, 255, 0.08);
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-logo svg {
            width: 70px;
            height: 70px;
            stroke: white;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 
                    0 8px 24px rgba(42, 102, 255, 0.25),
                    0 0 0 12px rgba(42, 102, 255, 0.08);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 
                    0 12px 32px rgba(42, 102, 255, 0.35),
                    0 0 0 16px rgba(42, 102, 255, 0.12);
            }
        }

        /* Loading Title */
        .loading-title {
            font-size: 28px;
            font-weight: 700;
            color: #0E1A34;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .loading-subtitle {
            font-size: 16px;
            color: #8A94A6;
            font-weight: 500;
            margin-bottom: 48px;
        }

        /* Spinner */
        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid #E6EAF2;
            border-top-color: #2A66FF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Progress Bar */
        .progress-container {
            width: 300px;
            height: 6px;
            background: #E6EAF2;
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto 24px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2A66FF, #467DFF);
            border-radius: 10px;
            animation: progress 2s ease-in-out forwards;
            box-shadow: 0 0 10px rgba(42, 102, 255, 0.4);
        }

        @keyframes progress {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        /* Status Messages */
        .status-message {
            font-size: 14px;
            font-weight: 600;
            color: #2A66FF;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        /* Loading Steps */
        .loading-steps {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .loading-step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(230, 234, 242, 0.6);
            opacity: 0;
            animation: stepFadeIn 0.5s ease forwards;
            min-width: 280px;
        }

        .loading-step:nth-child(1) {
            animation-delay: 0.3s;
        }

        .loading-step:nth-child(2) {
            animation-delay: 0.6s;
        }

        .loading-step:nth-child(3) {
            animation-delay: 0.9s;
        }

        @keyframes stepFadeIn {
            to {
                opacity: 1;
            }
        }

        .step-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-icon svg {
            width: 20px;
            height: 20px;
            stroke: #00C187;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .step-text {
            font-size: 14px;
            font-weight: 600;
            color: #3A4560;
        }

        .step-spinner {
            margin-left: auto;
            width: 16px;
            height: 16px;
            border: 2px solid #E6EAF2;
            border-top-color: #2A66FF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .loading-logo {
                width: 120px;
                height: 120px;
            }

            .loading-title {
                font-size: 24px;
            }

            .loading-subtitle {
                font-size: 14px;
            }

            .progress-container {
                width: 240px;
            }

            .loading-step {
                min-width: 240px;
            }
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="ai-waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="loading-container">
        <div class="loading-logo">
            <svg viewBox="0 0 24 24">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
        </div>

        <h1 class="loading-title">Processing Reports</h1>
        <p class="loading-subtitle">AI is analyzing patient data...</p>

        <div class="spinner-container">
            <div class="spinner"></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="status-message">Preparing diagnostic insights</div>

        <div class="loading-steps">
            <div class="loading-step">
                <div class="step-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <span class="step-text">Uploading medical files</span>
            </div>
            <div class="loading-step">
                <div class="step-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <span class="step-text">Analyzing lab results</span>
            </div>
            <div class="loading-step">
                <div class="step-icon">
                    <div class="step-spinner"></div>
                </div>
                <span class="step-text">Generating patient profile</span>
            </div>
        </div>
    </div>

    <script>
        // Auto-redirect after 2 seconds (editable duration)
        const REDIRECT_DELAY = 2000; // Change this value to adjust delay (in milliseconds)
        
        setTimeout(() => {
            window.location.href = '[Final] Patient Profile.html';
        }, REDIRECT_DELAY);
    </script>
</body>
</html>
